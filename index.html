<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>alupigus</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171713;
      --paper: #f4f0e8;
      --accent: #ff5a36;
      --line: rgba(23, 23, 19, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px clamp(20px, 5vw, 72px) 22px;
      overflow: hidden;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .mark { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .tag { color: #77746d; }

    main {
      display: grid;
      place-items: center;
      position: relative;
      min-height: 70vh;
    }

    .word-wrap { position: relative; text-align: center; }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(68px, 17vw, 230px);
      line-height: .82;
      letter-spacing: -.095em;
      font-weight: 900;
      cursor: default;
      transition: color .25s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    }

    h1:hover { color: var(--accent); transform: rotate(-2deg) scale(1.035); }

    .orbit {
      position: absolute;
      z-index: 0;
      width: clamp(170px, 28vw, 360px);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }
    .orbit::before { top: 11%; right: 15%; }
    .orbit::after { bottom: 14%; left: 12%; width: 5px; height: 5px; background: var(--ink); }

    .caption {
      margin: 30px 0 0;
      color: #77746d;
      font-size: 12px;
      letter-spacing: .04em;
    }

    footer { border-top: 1px solid var(--line); padding-top: 16px; color: #77746d; }
    footer span:last-child { color: var(--ink); }

    @media (max-width: 520px) {
      .page { padding-top: 20px; padding-bottom: 16px; }
      header, footer { font-size: 9px; letter-spacing: .1em; }
      .caption { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark"><span class="dot" aria-hidden="true"></span><span>un cuvânt. un vibe.</span></div>
      <span class="tag">ediția 001</span>
    </header>

    <main>
      <div class="word-wrap">
        <div class="orbit" aria-hidden="true"></div>
        <h1>alupigus</h1>
        <p class="caption">Ai ajuns unde trebuie.</p>
      </div>
    </main>

    <footer>
      <span>făcut pe internet</span>
      <span>alupigus © 2026</span>
    </footer>
  </div>
</body>
</html>
